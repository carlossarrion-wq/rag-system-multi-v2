# Default application (if none specified)
default_application: "gadea"

# Global logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "/home/ec2-user/rag-system/logs/rag_system.log"
  max_file_size: "10MB"
  backup_count: 5

# Global environment configuration
environment:
  name: "production"
  debug: false
  max_concurrent_requests: 10
  request_timeout: 30
