# Processing settings
settings:
  # Minimum word length to consider (words shorter than this are filtered out)
  min_word_length: 3
  
  # Maximum number of key terms to extract
  max_key_terms: 10
  
  # Case sensitivity for stop word matching
  case_sensitive: false
  
  # Whether to use NLTK stop words in addition to custom ones
  use_nltk_stopwords: true
  
  # Languages to load from NLTK (if use_nltk_stopwords is true)
  nltk_languages:
    - "english"
    - "spanish"
